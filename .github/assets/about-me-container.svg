<svg fill="none" viewBox="0 0 850 270" width="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #12101C; stroke: rgba(255, 255, 255, 0.12); stroke-width: 1.5; }
    .header-text { font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace; font-size: 15px; font-weight: 700; fill: #E2E8F0; letter-spacing: 0.5px; }
    .line-num { font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 14px; font-weight: 600; fill: #64748B; user-select: none; }
    .content-text { font-family: 'Fira Code', 'Inter', -apple-system, BlinkMacSystemFont, monospace; font-size: 14px; font-weight: 500; fill: #E2E8F0; }
  </style>

  <!-- Card Background -->
  <rect class="bg" width="850" height="270" rx="16" />

  <!-- Window Control Dots -->
  <circle cx="36" cy="32" r="6.5" fill="#EF4444" />
  <circle cx="56" cy="32" r="6.5" fill="#F59E0B" />
  <circle cx="76" cy="32" r="6.5" fill="#10B981" />

  <!-- Header Title -->
  <text x="104" y="37" class="header-text">Developer Profile</text>

  <!-- Divider Line -->
  <line x1="24" y1="56" x2="826" y2="56" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Line 01 -->
  <text x="36" y="96" class="line-num">01</text>
  <text x="72" y="96" class="content-text">🎓 BS Information Technology Graduate from the Philippines 🇵🇭</text>

  <!-- Line 02 -->
  <text x="36" y="130" class="line-num">02</text>
  <text x="72" y="130" class="content-text">💻 Passionate about Web Dev &amp; Building Real-World Systems</text>

  <!-- Line 03 -->
  <text x="36" y="164" class="line-num">03</text>
  <text x="72" y="164" class="content-text">🎨 I love creating interactive UIs, dashboards &amp; modern web apps</text>

  <!-- Line 04 -->
  <text x="36" y="198" class="line-num">04</text>
  <text x="72" y="198" class="content-text">📚 Currently exploring TypeScript, React, Supabase &amp; Firebase</text>

  <!-- Line 05 -->
  <text x="36" y="232" class="line-num">05</text>
  <text x="72" y="232" class="content-text">⚡ Fun fact: I turn ideas into functional, responsive applications!</text>
</svg>
